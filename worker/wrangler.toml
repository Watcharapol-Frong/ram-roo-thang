name = "ram-roo-thang-bot"
main = "src/index.js"
compatibility_date = "2026-08-21"

[vars]
LIFF_URL = "https://liff.line.me/2011201463-2rdSwrwB"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "CHAT_HISTORY_RAM"
id = "8bd20354236540b59ad64da34f43c6ee"

[[kv_namespaces]]
binding = "BASELINE_DATA"
id = "f14025c3ea9241aaa4b8559eab96b343"

[[kv_namespaces]]
binding = "PARKING_REPORTS"
id = "f69bf1e6461c4627979722c3b45fb5f7"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2de6b2c154d6455d84aa133a0a61e708"

# ข้อมูลของผู้ใช้ (โปรไฟล์ เหรียญ ledger ตารางสอบ) ย้ายจาก KV มาที่นี่ — ต้องการ transaction จริง
# ตอนบวก/หักเหรียญ และต้อง query/รวมยอดได้ ซึ่ง KV ทำไม่ได้เลย
# สร้างที่ภูมิภาค APAC เพราะ D1 เขียนที่ primary ที่เดียว ถ้าไปตกอเมริกา write จากไทยจะช้าชัดเจน
[[d1_databases]]
binding = "DB"
database_name = "ram-roo-thang"
database_id = "139f683a-4cbb-4dff-af37-81328699f328"

# cron ของ Cloudflare เป็น UTC เสมอ ไม่มี timezone ให้ตั้ง — เวลาไทยคือ UTC+7
#
#   0 0  * * *  = 07:00 น.  สรุปประจำวัน: วันนี้เรียนอะไร สอบอะไร ที่ไหนบ้าง
#   0 11 * * *  = 18:00 น.  เตือนล่วงหน้า 1 วันว่าพรุ่งนี้มีสอบ (ให้เวลาเตรียมตัว)
#
# เก็บไว้ทั้งคู่ตั้งใจ — ตัวเย็นทำหน้าที่ "เตรียมตัว" ตัวเช้าทำหน้าที่ "วันนี้ไปไหน"
# สอบพลาดเสียหายกว่าเรียน จึงยอมให้วิชาสอบถูกเตือนสองรอบ
[triggers]
crons = ["0 0 * * *", "0 11 * * *"]
